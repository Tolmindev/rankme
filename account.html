<script>
const panel = document.getElementById('panel');
const navBtn = document.getElementById('loginBtn');

function providerIcon(p){
  if(p==='discord') return `<span class="ico discord"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M20 4.4A18 18 0 0 0 15.6 3l-.3.6a15 15 0 0 1 3.8 1.4A16 16 0 0 0 12 3.4 16 16 0 0 0 4.9 5 15 15 0 0 1 8.7 3.6L8.4 3A18 18 0 0 0 4 4.4C1.6 8 1 11.6 1.2 15.1A18 18 0 0 0 6.6 18l.8-1.3a11 11 0 0 1-1.8-.9l.5-.4a13 13 0 0 0 11.8 0l.5.4c-.6.3-1.2.6-1.8.9l.8 1.3a18 18 0 0 0 5.4-2.9C23 11.4 22.1 7.8 20 4.4ZM8.7 13.6c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm6.6 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Z"/></svg></span>`;
  if(p==='twitter' || p==='x') return `<span class="ico" style="background:#000"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2Zm-1.2 18h1.7L7.4 4H5.6L17.7 20Z"/></svg></span>`;
  return `<span class="ico google"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></span>`;
}

function coverForTemplate(tid){
  return (window.RankMeCatalog && RankMeCatalog.cover(tid)) || '';
}

function titleForTemplate(tid, fallback){
  return (window.RankMeCatalog && RankMeCatalog.title(tid, fallback)) || fallback || tid || 'Ranking';
}

function emptySavedHtml(text){
  return `<div class="saved-empty">
    <img class="saved-ghost" src="assets/icons/ghost.svg" alt="">
    <p>${text}</p>
  </div>`;
}

function bindSquishy(root){
  (root || document).querySelectorAll('.toggle-checkbox').forEach(cb=>{
    if(cb.dataset.bound) return;
    cb.dataset.bound = '1';
    cb.addEventListener('click', ()=> cb.classList.add('toggled-once'), { once: true });
  });
}

function bindSavedMarquee(root){
  (root || document).querySelectorAll('.sc-title').forEach(titleEl=>{
    const textEl = titleEl.querySelector('.sc-title-text');
    if (textEl && textEl.scrollWidth > titleEl.clientWidth + 2) titleEl.classList.add('is-long');
  });
}

function closeSavedMenus(except){
  document.querySelectorAll('.sc-menu.open').forEach(m=>{
    if (m !== except) m.classList.remove('open');
  });
}

function savedCardHtml(r, opts){
  opts = opts || {};
  const isPublicView = !!opts.publicView;
  const tid = r.template_id || 'sf-duel';
  const cover = coverForTemplate(tid);
  const title = titleForTemplate(tid, r.title).replace(/</g,'');
  const ago = typeof timeAgo === 'function' ? timeAgo(r.updated_at || r.created_at) : '';
  const likes = typeof formatCount === 'function' ? formatCount(r.like_count) : String(r.like_count || 0);
  const views = typeof formatCount === 'function' ? formatCount(r.view_count) : String(r.view_count || 0);
  const pub = !!r.is_public;
  const openHref = isPublicView
    ? 'tier.html?t=' + encodeURIComponent(tid) + '&c=' + encodeURIComponent(r.id)
    : 'tier.html?t=' + encodeURIComponent(tid);
  const menu = isPublicView ? '' : `
    <div class="sc-menu">
      <button type="button" class="sc-dots" aria-label="More" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div class="sc-drop" role="menu">
        <a href="${openHref}" data-open="${r.id}" role="menuitem">Open</a>
        <button type="button" class="sc-drop-item" data-share="${r.id}" role="menuitem">Share</button>
        <label class="sc-drop-pub">
          <span>Publish to Community</span>
          <span class="toggle-container">
            <input class="toggle-checkbox" type="checkbox" data-pub="${r.id}" ${pub ? 'checked' : ''} aria-label="Publish to Community">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </span>
        </label>
        <button type="button" class="sc-drop-item is-del" data-del="${r.id}" role="menuitem">Delete</button>
      </div>
    </div>`;
  return `<article class="saved-card" data-id="${r.id}">
    <a class="sc-cover" href="${openHref}" data-open="${r.id}">
      <img src="${cover}" alt="" loading="lazy">
    </a>
    <div class="sc-body">
      <a class="sc-title" href="${openHref}" data-open="${r.id}"><span class="sc-title-text">${title}</span></a>
      <div class="sc-stats">
        ${ago ? `<span class="sc-ago">${ago}</span>` : ''}
        <span class="sc-stat"><img src="assets/icons/heart.svg" alt="">${likes}</span>
        <span class="sc-stat"><img src="assets/icons/view.svg" alt="">${views}</span>
      </div>
      ${isPublicView ? '' : `<div class="sc-status ${pub ? 'is-pub' : ''}">${pub ? 'Published' : 'Unpublished'}</div>`}
    </div>
    ${menu}
  </article>`;
}

async function renderLogin(){
  navBtn.textContent = 'Account';
  navBtn.classList.remove('login-btn-avatar', 'logged-in');
  panel.innerHTML = `
    <h1 class="account-h1">Login</h1>
    <p class="sub">Login to save <b>Exclusive</b> rankings. Custom images stay on your device.</p>
    <div class="providers">
      <button class="prov" data-p="discord">${providerIcon('discord')} Continue with Discord</button>
      <button class="prov" data-p="google">${providerIcon('google')} Continue with Google</button>
      <button class="prov" data-p="x">${providerIcon('x')} Continue with X</button>
    </div>
    <p class="err" id="err" hidden></p>`;
  panel.querySelectorAll('.prov').forEach(b=>{
    b.onclick = async ()=>{
      try{
        sessionStorage.setItem('rankme_last_provider', b.dataset.p);
        await rankmeSignIn(b.dataset.p);
      }catch(e){
        const err = document.getElementById('err');
        err.hidden = false;
        err.textContent = e.message || String(e);
      }
    };
  });
}


function profileBlock(name, avatarHtml, lists, battles, likes, editable){
  const safe = name.replace(/</g,'');
  const nameEl = editable
    ? `<b class="ap-name is-edit" id="apName" contenteditable="true" spellcheck="false">${safe}</b>
      <span class="ap-hint" id="apHint"></span>`
    : `<b class="ap-name">${safe}</b>`;
  return `
    <div class="account-profile">
      <div class="ap-avatar-wrap">${avatarHtml}</div>
      <div class="ap-text">
        ${nameEl}
      </div>
      <div class="ap-stats" id="apStats">
        <div class="ap-stat"><b id="statLists">${lists}</b><span>Tier Lists</span></div>
        <div class="ap-stat"><b id="statBattles">${battles}</b><span>Battles</span></div>
        <div class="ap-stat"><b id="statAch">0</b><span>Achievements</span></div>
        <div class="ap-stat"><b id="statLikes">${likes}</b><span>Likes</span></div>
      </div>
    </div>`;
}

function wireNameEdit(){
  const el = document.getElementById('apName');
  const hint = document.getElementById('apHint');
  if(!el || typeof setRankmeDisplayName !== 'function') return;
  const NAME_MAX = 18;
  let last = (el.textContent || '').trim();
  const showHint = (msg)=>{
    if(!hint) return;
    hint.textContent = msg || '';
  };
  const flashSaved = ()=>{
    el.classList.remove('is-saved');
    void el.offsetWidth;
    el.classList.add('is-saved');
  };
  el.addEventListener('beforeinput', (e)=>{
    if(e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak'){
      e.preventDefault();
      return;
    }
    if(!e.data) return;
    const sel = window.getSelection();
    const selected = sel && sel.toString() ? sel.toString().length : 0;
    if((el.textContent || '').length - selected + e.data.length > NAME_MAX){
      e.preventDefault();
      showHint('18 characters max');
    }
  });
  el.addEventListener('paste', (e)=>{
    e.preventDefault();
    const text = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\s+/g, ' ').replace(/\n/g, '');
    const sel = window.getSelection();
    const selected = sel && sel.toString() ? sel.toString().length : 0;
    const room = NAME_MAX - ((el.textContent || '').length - selected);
    if(room <= 0){ showHint('18 characters max'); return; }
    const slice = text.slice(0, room);
    document.execCommand('insertText', false, slice);
    if(text.length > room) showHint('18 characters max');
  });
  el.addEventListener('input', ()=>{
    const next = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if((el.textContent || '').length >= NAME_MAX) return;
    if(!next || next === last || typeof validateDisplayName !== 'function'){ showHint(''); return; }
    const v = validateDisplayName(next);
    showHint(v.ok ? '' : v.error);
  });
  el.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); el.blur(); }
    if(e.key === 'Escape'){ el.textContent = last; showHint(''); el.blur(); }
  });
  el.addEventListener('blur', async ()=>{
    const next = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if(next === last){ el.textContent = last; showHint(''); return; }
    if(typeof validateDisplayName === 'function'){
      const v = validateDisplayName(next);
      if(!v.ok){
        el.textContent = last;
        showHint(v.error);
        return;
      }
    }
    flashSaved();
    try{
      const clean = await setRankmeDisplayName(next);
      last = clean;
      el.textContent = clean;
      showHint('');
      if(typeof updateNavAuth === 'function') updateNavAuth();
    }catch(e){
      el.textContent = last;
      showHint(e.message || 'Could not save');
    }
  });
}

async function renderCabinet(user){
  if (typeof updateNavAuth === 'function') updateNavAuth();
  const name = (typeof rankmeDisplayName === 'function' ? rankmeDisplayName(user) : (user.user_metadata?.full_name || user.email || 'User'));
  const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || '';
  const av = avatar
    ? `<img class="ap-avatar" src="${avatar}" alt="">`
    : `<div class="ap-avatar ap-fallback">${(name[0]||'U').toUpperCase()}</div>`;

  panel.removeAttribute('aria-busy');
  panel.innerHTML = `
    ${profileBlock(name, av, '0', '0', '0', true)}

    <section class="account-section">
      <div class="as-head">
        <h2>Saved</h2>
      </div>
      <div class="saved-grid" id="listBox"></div>
    </section>

    <div class="as-more" id="savedMore" hidden>
      <button type="button" class="cc-show-all" id="savedShowAll">Show more</button>
    </div>

    <section class="account-section account-section-ach">
      <div class="as-head">
        <div>
          <h2>Achievements</h2>
        </div>
      </div>
      <div class="ach-grid" id="achGrid"></div>
    </section>

    <button class="login-btn ghost" id="logout">Log out</button>`;

  document.getElementById('logout').onclick = async ()=>{
    await rankmeSignOut();
    location.reload();
  };
  wireNameEdit();

  try{
    const rows = await listMyTierlists();
    const box = document.getElementById('listBox');
    const totalLikes = rows.reduce((s,r)=> s + (Number(r.like_count)||0), 0);
    document.getElementById('statLists').textContent = String(rows.length);
    (async function () {
      var el = document.getElementById('statBattles');
      if (!el || typeof getUserBattleCount !== 'function') return;
      try {
        var uid = (window.__rankmeUser && window.__rankmeUser.id) || null;
        if (!uid && typeof initSupabase === 'function') {
          var c = await initSupabase();
          if (c) { var gu = await c.auth.getUser(); uid = gu.data && gu.data.user && gu.data.user.id; }
        }
        if (uid) el.textContent = String(await getUserBattleCount(uid));
      } catch (e) {}
    })();
    document.getElementById('statLikes').textContent = typeof formatCount === 'function' ? formatCount(totalLikes) : String(totalLikes);

    if(!rows.length){
      box.innerHTML = emptySavedHtml('Nothing saved yet.');
    } else {
      paintSavedList(rows, { owner: true, user: user });
    }
    if (window.RankMeAch) {
      await RankMeAch.onLogin(user);
      if (rows.some(function(r){ return r.is_public; })) {
        await RankMeAch.onPublish(user, { toast: false });
      }
      RankMeAch.paint(user);
    }
  }catch(e){
    document.getElementById('listBox').innerHTML = `<div class="empty">Could not load lists. <button type="button" class="btn-mini" onclick="location.reload()">Retry</button></div>`;
    if (window.RankMeAch) RankMeAch.paint(user);
  }
}

function wireSavedActions(rows, user){
  const box = document.getElementById('listBox');
  if(!box) return;

  box.querySelectorAll('[data-open]').forEach(a=>{
    a.addEventListener('click', ()=>{
      const id = a.getAttribute('data-open');
      const row = rows.find(x=>String(x.id)===String(id));
      if(row?.payload){
        sessionStorage.setItem('rankme_open_payload', JSON.stringify(row.payload));
        sessionStorage.setItem('rankme_saved_id', String(row.id));
        try {
          sessionStorage.removeItem('rankme_community_id');
          sessionStorage.removeItem('rankme_community_row');
          sessionStorage.setItem('rankme_open_title', row.title || '');
          if (row.payload && row.payload.subtitle) {
            sessionStorage.setItem('rankme_open_subtitle', String(row.payload.subtitle));
          } else {
            sessionStorage.removeItem('rankme_open_subtitle');
          }
        } catch (err) {}
      }
    });
  });

  box.querySelectorAll('.sc-dots').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const menu = btn.closest('.sc-menu');
      const open = !menu.classList.contains('open');
      closeSavedMenus(menu);
      menu.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
  box.querySelectorAll('.sc-drop').forEach(drop=>{
    drop.addEventListener('click', (e)=> e.stopPropagation());
  });

  box.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.del;
      const modal = document.getElementById('delModal');
      modal.classList.add('open');
      const ok = document.getElementById('delOk');
      const cancel = document.getElementById('delCancel');
      const cleanup = ()=>{ modal.classList.remove('open'); ok.onclick=null; cancel.onclick=null; };
      cancel.onclick = cleanup;
      ok.onclick = async ()=>{
        cleanup();
        await deleteTierlist(id);
        renderCabinet(user);
      };
    };
  });

  box.querySelectorAll('[data-share]').forEach(btn=>{
    btn.onclick = async ()=>{
      const row = rows.find(x=>String(x.id)===String(btn.dataset.share));
      if(!row) return;
      try{
        const tid = encodeURIComponent(row.template_id || 'sf-duel');
        let url = location.origin + '/tier.html?t=' + tid;
        if(row.is_public){
          url = location.origin + '/tier.html?t=' + tid + '&c=' + encodeURIComponent(row.id);
        } else if(row.payload && typeof createShortLink === 'function'){
          const code = await createShortLink(row.payload);
          if(code) url = location.origin + '/tier.html?t=' + tid + '&s=' + code;
        }
        await navigator.clipboard.writeText(url);
        const prev = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(()=> btn.textContent = prev, 1500);
      }catch(e){
        alert('Could not copy link');
      }
    };
  });

  box.querySelectorAll('[data-pub]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const id = cb.getAttribute('data-pub');
      const on = cb.checked;
      try{
        await setTierlistPublic(id, on);
        const card = cb.closest('.saved-card');
        const st = card?.querySelector('.sc-status');
        if(st){
          st.textContent = on ? 'Published' : 'Unpublished';
          st.classList.toggle('is-pub', on);
        }
        const row = rows.find(x=>String(x.id)===String(id));
        if(row) row.is_public = on;
        if (on && window.RankMeAch) {
          await RankMeAch.onPublish(user, { toast: true });
          RankMeAch.paint(user);
        }
      }catch(e){
        cb.checked = !on;
        alert('Could not update. Try again in a moment.');
      }
    });
  });
}

if (!window.__rmSavedMenuBound) {
  window.__rmSavedMenuBound = true;
  document.addEventListener('click', ()=> closeSavedMenus());
  document.addEventListener('keydown', (e)=>{
    if (e.key === 'Escape') closeSavedMenus();
  });
}

async function renderPublicProfile(userId){
  panel.removeAttribute('aria-busy');
  document.title = 'Profile - RankMe';

  let rows = [];
  try {
    rows = typeof listPublicTierlistsByUser === 'function'
      ? await listPublicTierlistsByUser(userId)
      : [];
  } catch (e) {
    panel.innerHTML = '<div class="empty">Could not load profile. Try again in a moment.</div>';
    return;
  }

  const first = rows[0] || {};
  const name = (first.author_name || 'User').replace(/</g, '');
  const avatar = first.author_avatar || '';
  const totalLikes = rows.reduce((s, r) => s + (Number(r.like_count) || 0), 0);
  const fc = typeof formatCount === 'function' ? formatCount : String;
  const av = avatar
    ? `<img class="ap-avatar" src="${String(avatar).replace(/"/g, '')}" alt="">`
    : `<div class="ap-avatar ap-fallback">${(name[0] || 'U').toUpperCase()}</div>`;

  panel.innerHTML = `
    ${profileBlock(name, av, String(rows.length), '0', fc(totalLikes))}

    <section class="account-section">
      <div class="as-head">
        <h2>Published</h2>
      </div>
      <div class="saved-grid" id="listBox"></div>
    </section>

    <div class="as-more" id="savedMore" hidden>
      <button type="button" class="cc-show-all" id="savedShowAll">Show more</button>
    </div>

    <section class="account-section account-section-ach">
      <div class="as-head">
        <div>
          <h2>Achievements</h2>
        </div>
      </div>
      <div class="ach-grid" id="achGrid"></div>
    </section>`;

  var extra = rows.length ? ['certified-sheep'] : [];
  var viewer = window.__rankmeUser;
  if (window.RankMeAch) {
    if (viewer && String(viewer.id) === String(userId)) RankMeAch.paint(viewer);
    else RankMeAch.paint(null, extra);
  }

  (async function () {
    var el = document.getElementById('statBattles');
    if (!el || typeof getUserBattleCount !== 'function') return;
    try {
      var uid = new URLSearchParams(location.search).get('u');
      if (uid) el.textContent = String(await getUserBattleCount(uid));
    } catch (e) {}
  })();

  const box = document.getElementById('listBox');
  if (!rows.length) {
    box.innerHTML = emptySavedHtml('No public rankings yet.');
    return;
  }

  paintSavedList(rows, { owner: false });
}

const SAVED_VISIBLE = 6;

function paintSavedList(rows, opts){
  opts = opts || {};
  const box = document.getElementById('listBox');
  const more = document.getElementById('savedMore');
  let showAll = false;
  const paint = ()=>{
    const slice = (showAll || rows.length <= SAVED_VISIBLE) ? rows : rows.slice(0, SAVED_VISIBLE);
    box.innerHTML = slice.map(r => savedCardHtml(r, { publicView: !opts.owner })).join('');
    if (more) {
      if (rows.length > SAVED_VISIBLE) {
        more.hidden = false;
        const btn = document.getElementById('savedShowAll');
        btn.textContent = showAll ? 'Show less' : 'Show more';
        btn.onclick = ()=>{ showAll = !showAll; paint(); };
      } else {
        more.hidden = true;
      }
    }
    bindSavedMarquee(box);
    if (opts.owner) {
      bindSquishy(box);
      wireSavedActions(rows, opts.user);
    } else {
      wirePublicActions(rows);
    }
  };
  paint();
}

function wirePublicActions(rows) {
  const box = document.getElementById('listBox');
  if (!box) return;

  box.querySelectorAll('[data-open]').forEach(a => {
    a.addEventListener('click', () => {
      const id = a.getAttribute('data-open');
      const row = rows.find(x => String(x.id) === String(id));
      if (row?.payload) {
        sessionStorage.setItem('rankme_open_payload', JSON.stringify(row.payload));
        sessionStorage.setItem('rankme_community_id', String(row.id));
      }
    });
  });

  box.querySelectorAll('[data-share]').forEach(btn => {
    btn.onclick = async () => {
      const row = rows.find(x => String(x.id) === String(btn.dataset.share));
      if (!row) return;
      try {
        const tid = encodeURIComponent(row.template_id || 'sf-duel');
        const url = location.origin + '/tier.html?t=' + tid + '&c=' + encodeURIComponent(row.id);
        await navigator.clipboard.writeText(url);
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Share'; }, 1500);
      } catch (e) {
        alert('Could not copy link');
      }
    };
  });
}

async function bootAccount(){
  if (typeof initSupabase !== 'function') {
    panel.innerHTML = '<div class="empty">Could not load auth. Refresh the page.</div>';
    return;
  }
  try {
    if (window.RankMeCatalog) await RankMeCatalog.load();
    if (window.RankMeAch) await RankMeAch.load();
    await initSupabase();
    if (typeof updateNavAuth === 'function') updateNavAuth();

    const params = new URLSearchParams(location.search);
    const publicUid = params.get('u');
    if (publicUid) {
      await renderPublicProfile(publicUid);
      return;
    }

    const user = await getSessionUser();
    if (user) {
      try {
        const ret = sessionStorage.getItem('rankme_login_return');
        const draft = sessionStorage.getItem('rankme_draft_payload');
        if (ret && draft) {
          location.href = ret;
          return;
        }
      } catch (e) {}
      await renderCabinet(user);
    } else {
      await renderLogin();
    }
  } catch (e) {
    console.error(e);
    panel.innerHTML = '<div class="empty">Something went wrong. <button type="button" class="btn-mini primary" onclick="location.reload()">Retry</button></div>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootAccount);
} else {
  bootAccount();
}
</script>
