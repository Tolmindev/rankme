<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - RankMe</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css?v=20260821community">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabaseClient.js" defer></script>
</head>
<body class="page-account">
<header class="site">
  <a class="brand" href="index.html"><img src="assets/brand/RankMe_logo.svg" alt="RankMe"></a>
  <nav class="main">
    <a href="index.html">Browse</a>
    <a href="create.html" class="cta-nav">Create</a>
    <a class="login-btn" id="loginBtn" href="account.html">Account</a>
  </nav>
</header>

<div class="account-bg" aria-hidden="true"></div>

<div class="wrap account-wrap">
  <div class="panel-card account-panel" id="panel" aria-busy="true">
    <div class="skel-account" aria-hidden="true">
      <div class="skel-account-head">
        <div class="skel-block skel-avatar-lg"></div>
        <div class="skel-skel-text">
          <div class="skel-line skel-line-title"></div>
          <div class="skel-line skel-line-meta"></div>
        </div>
      </div>
      <div class="skel-line skel-line-sub"></div>
      <div class="skel-account-list">
        <div class="skel-block skel-account-row"></div>
        <div class="skel-block skel-account-row"></div>
        <div class="skel-block skel-account-row"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-back" id="delModal">
  <div class="modal">
    <h3>Delete?</h3>
    <p>This cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="primary" id="delCancel">Cancel</button>
      <button type="button" class="danger" id="delOk">Delete</button>
    </div>
  </div>
</div>

<footer id="site-footer" class="site"></footer>
<script src="js/footer.js" defer></script>

<script>
const panel = document.getElementById('panel');
const navBtn = document.getElementById('loginBtn');

function providerIcon(p){
  if(p==='discord') return `<span class="ico discord"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M20 4.4A18 18 0 0 0 15.6 3l-.3.6a15 15 0 0 1 3.8 1.4A16 16 0 0 0 12 3.4 16 16 0 0 0 4.9 5 15 15 0 0 1 8.7 3.6L8.4 3A18 18 0 0 0 4 4.4C1.6 8 1 11.6 1.2 15.1A18 18 0 0 0 6.6 18l.8-1.3a11 11 0 0 1-1.8-.9l.5-.4a13 13 0 0 0 11.8 0l.5.4c-.6.3-1.2.6-1.8.9l.8 1.3a18 18 0 0 0 5.4-2.9C23 11.4 22.1 7.8 20 4.4ZM8.7 13.6c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm6.6 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Z"/></svg></span>`;
  if(p==='twitter' || p==='x') return `<span class="ico" style="background:#000"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2Zm-1.2 18h1.7L7.4 4H5.6L17.7 20Z"/></svg></span>`;
  return `<span class="ico google"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></span>`;
}

function resolveProvider(user){
  const ids = user?.identities || [];
  const last = sessionStorage.getItem('rankme_last_provider');
  if(last && ids.some(i => i.provider === last)) return last === 'twitter' ? 'x' : last;
  if(ids.length){
    const sorted = [...ids].sort((a,b)=> new Date(b.last_sign_in_at||b.updated_at||0) - new Date(a.last_sign_in_at||a.updated_at||0));
    const p = sorted[0]?.provider || 'oauth';
    return p === 'twitter' ? 'x' : p;
  }
  const p = user?.app_metadata?.provider || 'oauth';
  return p === 'twitter' ? 'x' : p;
}

function coverForTemplate(tid){
  const map = {
    'lol': 'assets/brand/LoL_Cover_thumb.webp',
    'sf-duel': 'assets/brand/SF_Cover_1_thumb.webp',
    'sf-duel-ex': 'assets/brand/SFD_EX_Cover_thumb.webp',
    'sf6': 'assets/brand/SF6_Cover_thumb.webp',
    'dota2': 'assets/brand/Dota2_Cover_thumb.webp',
  };
  return map[tid] || 'assets/brand/SF_Cover_1_thumb.webp';
}

function titleForTemplate(tid, fallback){
  const map = {
    'lol': 'League of Legends',
    'sf-duel': 'Street Fighter: Duel',
    'sf-duel-ex': 'SF Duel EX-Move',
    'sf6': 'Street Fighter 6',
    'dota2': 'Dota 2',
  };
  return fallback || map[tid] || tid || 'Tier list';
}

function bindSquishy(root){
  (root || document).querySelectorAll('.toggle-checkbox').forEach(cb=>{
    if(cb.dataset.bound) return;
    cb.dataset.bound = '1';
    cb.addEventListener('click', ()=> cb.classList.add('toggled-once'), { once: true });
  });
}

async function renderLogin(){
  navBtn.textContent = 'Account';
  navBtn.classList.remove('login-btn-avatar', 'logged-in');
  panel.innerHTML = `
    <h1 class="account-h1">Login</h1>
    <p class="sub">Login to save <b>Exclusive</b> rankings. Custom images stay on your device.</p>
    <div class="providers">
      <button class="prov" data-p="discord">${providerIcon('discord')} Continue with Discord</button>
      <button class="prov" data-p="google">${providerIcon('google')} Continue with Google</button>
      <button class="prov" data-p="x">${providerIcon('x')} Continue with X</button>
    </div>
    <p class="err" id="err" hidden></p>`;
  panel.querySelectorAll('.prov').forEach(b=>{
    b.onclick = async ()=>{
      try{
        sessionStorage.setItem('rankme_last_provider', b.dataset.p);
        await rankmeSignIn(b.dataset.p);
      }catch(e){
        const err = document.getElementById('err');
        err.hidden = false;
        err.textContent = e.message || String(e);
      }
    };
  });
}

function savedCardHtml(r, opts){
  opts = opts || {};
  const isPublicView = !!opts.publicView;
  const tid = r.template_id || 'sf-duel';
  const cover = coverForTemplate(tid);
  const title = titleForTemplate(tid, r.title);
  const ago = typeof timeAgo === 'function' ? timeAgo(r.updated_at || r.created_at) : '';
  const likes = typeof formatCount === 'function' ? formatCount(r.like_count) : String(r.like_count || 0);
  const views = typeof formatCount === 'function' ? formatCount(r.view_count) : String(r.view_count || 0);
  const pub = !!r.is_public;
  // Public lists open with community context so bar + like work
  const openHref = isPublicView || pub
    ? 'tier.html?t=' + encodeURIComponent(tid) + '&c=' + encodeURIComponent(r.id)
    : 'tier.html?t=' + encodeURIComponent(tid);
  const actions = isPublicView
    ? `<div class="sc-actions">
        <a class="sc-btn sc-open" href="${openHref}" data-open="${r.id}">Open</a>
        <button type="button" class="sc-btn sc-share" data-share="${r.id}">Share</button>
      </div>`
    : `<div class="sc-actions">
        <a class="sc-btn sc-open" href="${openHref}" data-open="${r.id}">Open</a>
        <button type="button" class="sc-btn sc-share" data-share="${r.id}">Share</button>
        <button type="button" class="sc-btn sc-del" data-del="${r.id}">Delete</button>
      </div>
      <div class="sc-publish">
        <span>Publish to Community</span>
        <label class="toggle-container green">
          <input class="toggle-checkbox" type="checkbox" data-pub="${r.id}" ${pub ? 'checked' : ''} aria-label="Publish to Community">
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>
      </div>`;
  return `<article class="saved-card" data-id="${r.id}">
    <div class="sc-top">
      <a class="sc-cover" href="${openHref}" data-open="${r.id}">
        <span class="sc-tag sc-tag-cat">Games</span>
        <span class="sc-tag sc-tag-ex">Exclusive</span>
        <img src="${cover}" alt="" loading="lazy">
      </a>
      <div class="sc-info">
        <a class="sc-title" href="${openHref}" data-open="${r.id}">${title.replace(/</g,'')}</a>
        <div class="sc-meta">
          ${ago ? `<span>${ago}</span>` : ''}
          <span class="sc-stat"><img src="assets/icons/heart.svg" alt=""> ${likes}</span>
          <span class="sc-stat"><img src="assets/icons/view.svg" alt=""> ${views}</span>
        </div>
        ${isPublicView ? '' : `<div class="sc-status ${pub ? 'is-pub' : ''}">${pub ? 'Published' : 'Unpublished'}</div>`}
      </div>
    </div>
    ${actions}
  </article>`;
}

async function renderCabinet(user){
  if (typeof updateNavAuth === 'function') updateNavAuth();
  const name = user.user_metadata?.full_name || user.user_metadata?.custom_claims?.global_name || user.user_metadata?.name || user.email || 'User';
  const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || '';
  const provider = resolveProvider(user);
  const providerLabel = ({google:'Google', discord:'Discord', x:'X', twitter:'X'})[provider] || provider;

  panel.removeAttribute('aria-busy');
  panel.innerHTML = `
    <h1 class="account-h1 desktop-only">My Collection</h1>
    <div class="account-profile">
      <div class="ap-avatar-wrap">
        ${avatar ? `<img class="ap-avatar" src="${avatar}" alt="">` : `<div class="ap-avatar ap-fallback">${(name[0]||'U').toUpperCase()}</div>`}
      </div>
      <div class="ap-text">
        <b class="ap-name">${name.replace(/</g,'')}</b>
        <span class="ap-provider">${providerLabel}</span>
      </div>
      <div class="ap-stats" id="apStats">
        <div class="ap-stat"><b id="statLists">0</b><span>Tier Lists</span></div>
        <div class="ap-stat"><b id="statBattles">0</b><span>Battles</span></div>
        <div class="ap-stat"><b id="statAch">0</b><span>Achievements</span></div>
        <div class="ap-stat"><b id="statLikes">0</b><span>Likes</span></div>
      </div>
    </div>

    <section class="account-section">
      <div class="as-head">
        <div>
          <h2>Saved</h2>
          <p class="as-sub mobile-only">Saved Exclusive rankings</p>
        </div>
        <p class="as-sub desktop-only">Saved Exclusive rankings</p>
      </div>
      <div class="saved-grid" id="listBox"></div>
      <div class="as-more" id="savedMore" hidden>
        <button type="button" class="show-all-btn" id="savedShowAll">Show all</button>
      </div>
    </section>

    <section class="account-section">
      <div class="as-head">
        <div>
          <h2>Achievements</h2>
          <p class="as-sub mobile-only">Collectible Cards</p>
        </div>
        <p class="as-sub desktop-only">Collectible Cards</p>
      </div>
      <div class="ach-row" id="achRow">
        <div class="ach-card ach-placeholder-art" title="Coming soon">
          <div class="ach-soon">Soon</div>
        </div>
        <div class="ach-slot"></div>
        <div class="ach-slot"></div>
        <div class="ach-slot desktop-only"></div>
        <div class="ach-slot desktop-only"></div>
        <div class="ach-slot desktop-only"></div>
        <div class="ach-slot desktop-only"></div>
        <div class="ach-slot desktop-only"></div>
      </div>
      <div class="as-more">
        <button type="button" class="show-all-btn" disabled title="Coming soon">Show all</button>
      </div>
    </section>

    <button class="login-btn ghost" id="logout">Log out</button>`;

  document.getElementById('logout').onclick = async ()=>{
    await rankmeSignOut();
    location.reload();
  };

  try{
    const rows = await listMyTierlists();
    const box = document.getElementById('listBox');
    const totalLikes = rows.reduce((s,r)=> s + (Number(r.like_count)||0), 0);
    document.getElementById('statLists').textContent = String(rows.length);
    document.getElementById('statLikes').textContent = typeof formatCount === 'function' ? formatCount(totalLikes) : String(totalLikes);

    if(!rows.length){
      box.innerHTML = '<div class="empty">Nothing saved yet. Open an Exclusive template, rank, press Save.</div>';
    } else {
      const limit = window.matchMedia('(max-width:720px)').matches ? 1 : 3;
      let showAll = false;
      const paint = ()=>{
        const slice = showAll ? rows : rows.slice(0, limit);
        box.innerHTML = slice.map(r => savedCardHtml(r)).join('');
        const more = document.getElementById('savedMore');
        if(rows.length > limit){
          more.hidden = false;
          const btn = document.getElementById('savedShowAll');
          btn.textContent = showAll ? 'Show less' : 'Show all';
          btn.onclick = ()=>{ showAll = !showAll; paint(); };
        } else {
          more.hidden = true;
        }
        bindSquishy(box);
        wireSavedActions(rows, user);
      };
      paint();
    }
  }catch(e){
    document.getElementById('listBox').innerHTML = `<div class="empty">Could not load lists. ${e.message||''}</div>`;
  }
}

function wireSavedActions(rows, user){
  const box = document.getElementById('listBox');
  if(!box) return;

  box.querySelectorAll('[data-open]').forEach(a=>{
    a.addEventListener('click', (e)=>{
      const id = a.getAttribute('data-open');
      const row = rows.find(x=>String(x.id)===String(id));
      if(row?.payload){
        sessionStorage.setItem('rankme_open_payload', JSON.stringify(row.payload));
        sessionStorage.setItem('rankme_saved_id', String(row.id));
      }
    });
  });

  box.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.del;
      const modal = document.getElementById('delModal');
      modal.classList.add('open');
      const ok = document.getElementById('delOk');
      const cancel = document.getElementById('delCancel');
      const cleanup = ()=>{ modal.classList.remove('open'); ok.onclick=null; cancel.onclick=null; };
      cancel.onclick = cleanup;
      ok.onclick = async ()=>{
        cleanup();
        await deleteTierlist(id);
        renderCabinet(user);
      };
    };
  });

  box.querySelectorAll('[data-share]').forEach(btn=>{
    btn.onclick = async ()=>{
      const row = rows.find(x=>String(x.id)===String(btn.dataset.share));
      if(!row) return;
      try{
        const tid = encodeURIComponent(row.template_id || 'sf-duel');
        let url = location.origin + '/tier.html?t=' + tid;
        if(row.is_public){
          url = location.origin + '/tier.html?t=' + tid + '&c=' + encodeURIComponent(row.id);
        } else if(row.payload && typeof createShortLink === 'function'){
          const code = await createShortLink(row.payload);
          if(code) url = location.origin + '/tier.html?t=' + tid + '&s=' + code;
        }
        await navigator.clipboard.writeText(url);
        btn.textContent = 'Copied!';
        setTimeout(()=> btn.textContent = 'Share', 1500);
      }catch(e){
        alert('Could not copy link');
      }
    };
  });

  box.querySelectorAll('[data-pub]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const id = cb.getAttribute('data-pub');
      const on = cb.checked;
      try{
        await setTierlistPublic(id, on);
        const card = cb.closest('.saved-card');
        const st = card?.querySelector('.sc-status');
        if(st){
          st.textContent = on ? 'Published' : 'Unpublished';
          st.classList.toggle('is-pub', on);
        }
        const row = rows.find(x=>String(x.id)===String(id));
        if(row) row.is_public = on;
      }catch(e){
        cb.checked = !on;
        alert('Could not update publish state. Check is_public column in Supabase.');
      }
    });
  });
}

async function renderPublicProfile(userId){
  panel.removeAttribute('aria-busy');
  document.title = 'Profile - RankMe';

  let rows = [];
  try {
    rows = typeof listPublicTierlistsByUser === 'function'
      ? await listPublicTierlistsByUser(userId)
      : [];
  } catch (e) {
    panel.innerHTML = '<div class="empty">Could not load profile. ' + (e.message || '') + '</div>';
    return;
  }

  const first = rows[0] || {};
  const name = (first.author_name || 'User').replace(/</g, '');
  const avatar = first.author_avatar || '';
  const totalLikes = rows.reduce((s, r) => s + (Number(r.like_count) || 0), 0);
  const fc = typeof formatCount === 'function' ? formatCount : String;

  panel.innerHTML = `
    <h1 class="account-h1 desktop-only">Collection</h1>
    <div class="account-profile">
      <div class="ap-avatar-wrap">
        ${avatar
          ? `<img class="ap-avatar" src="${String(avatar).replace(/"/g, '')}" alt="">`
          : `<div class="ap-avatar ap-fallback">${(name[0] || 'U').toUpperCase()}</div>`}
      </div>
      <div class="ap-text">
        <b class="ap-name">${name}</b>
        <span class="ap-provider">Public profile</span>
      </div>
      <div class="ap-stats" id="apStats">
        <div class="ap-stat"><b id="statLists">${rows.length}</b><span>Tier Lists</span></div>
        <div class="ap-stat"><b>0</b><span>Battles</span></div>
        <div class="ap-stat"><b>0</b><span>Achievements</span></div>
        <div class="ap-stat"><b id="statLikes">${fc(totalLikes)}</b><span>Likes</span></div>
      </div>
    </div>

    <section class="account-section">
      <div class="as-head">
        <div>
          <h2>Published</h2>
          <p class="as-sub mobile-only">Public rankings</p>
        </div>
        <p class="as-sub desktop-only">Public rankings</p>
      </div>
      <div class="saved-grid" id="listBox"></div>
      <div class="as-more" id="savedMore" hidden>
        <button type="button" class="show-all-btn" id="savedShowAll">Show all</button>
      </div>
    </section>

    <section class="account-section">
      <div class="as-head">
        <div>
          <h2>Achievements</h2>
          <p class="as-sub mobile-only">Collectible Cards</p>
        </div>
        <p class="as-sub desktop-only">Collectible Cards</p>
      </div>
      <div class="ach-row" id="achRow">
        <div class="ach-card ach-placeholder-art" title="Coming soon"><div class="ach-soon">Soon</div></div>
        <div class="ach-slot"></div>
        <div class="ach-slot"></div>
        <div class="ach-slot desktop-only"></div>
        <div class="ach-slot desktop-only"></div>
        <div class="ach-slot desktop-only"></div>
        <div class="ach-slot desktop-only"></div>
        <div class="ach-slot desktop-only"></div>
      </div>
      <div class="as-more">
        <button type="button" class="show-all-btn" disabled title="Coming soon">Show all</button>
      </div>
    </section>`;

  const box = document.getElementById('listBox');
  if (!rows.length) {
    box.innerHTML = '<div class="empty">No public rankings yet.</div>';
    return;
  }

  const limit = window.matchMedia('(max-width:720px)').matches ? 1 : 3;
  let showAll = false;
  const paint = () => {
    const slice = showAll ? rows : rows.slice(0, limit);
    box.innerHTML = slice.map(r => savedCardHtml(r, { publicView: true })).join('');
    const more = document.getElementById('savedMore');
    if (rows.length > limit) {
      more.hidden = false;
      const btn = document.getElementById('savedShowAll');
      btn.textContent = showAll ? 'Show less' : 'Show all';
      btn.onclick = () => { showAll = !showAll; paint(); };
    } else {
      more.hidden = true;
    }
    wirePublicActions(rows);
  };
  paint();
}

function wirePublicActions(rows) {
  const box = document.getElementById('listBox');
  if (!box) return;

  box.querySelectorAll('[data-open]').forEach(a => {
    a.addEventListener('click', () => {
      const id = a.getAttribute('data-open');
      const row = rows.find(x => String(x.id) === String(id));
      if (row?.payload) {
        sessionStorage.setItem('rankme_open_payload', JSON.stringify(row.payload));
        sessionStorage.setItem('rankme_community_id', String(row.id));
      }
    });
  });

  box.querySelectorAll('[data-share]').forEach(btn => {
    btn.onclick = async () => {
      const row = rows.find(x => String(x.id) === String(btn.dataset.share));
      if (!row) return;
      try {
        const tid = encodeURIComponent(row.template_id || 'sf-duel');
        const url = location.origin + '/tier.html?t=' + tid + '&c=' + encodeURIComponent(row.id);
        await navigator.clipboard.writeText(url);
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Share'; }, 1500);
      } catch (e) {
        alert('Could not copy link');
      }
    };
  });
}

async function bootAccount(){
  if (typeof initSupabase !== 'function') {
    panel.innerHTML = '<div class="empty">Could not load auth. Refresh the page.</div>';
    return;
  }
  try {
    await initSupabase();
    if (typeof updateNavAuth === 'function') updateNavAuth();

    const params = new URLSearchParams(location.search);
    const publicUid = params.get('u');
    if (publicUid) {
      await renderPublicProfile(publicUid);
      return;
    }

    const user = await getSessionUser();
    if (user) {
      try {
        const ret = sessionStorage.getItem('rankme_login_return');
        const draft = sessionStorage.getItem('rankme_draft_payload');
        if (ret && draft) {
          location.href = ret;
          return;
        }
      } catch (e) {}
      await renderCabinet(user);
    } else {
      await renderLogin();
    }
  } catch (e) {
    console.error(e);
    panel.innerHTML = '<div class="empty">Something went wrong. <button type="button" class="btn-mini primary" onclick="location.reload()">Retry</button></div>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootAccount);
} else {
  bootAccount();
}
</script>
</body>
</html>
