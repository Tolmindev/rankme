<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - RankMe</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css?v=20260817account">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabaseClient.js" defer></script>

</head>
<body>
<header class="site">
  <a class="brand" href="index.html"><img src="assets/brand/RankMe_logo.svg" alt="RankMe"></a>
  <nav class="main">
    <a href="index.html">Browse</a>
    <a href="create.html" class="cta-nav">Create</a>
    <a class="login-btn" id="loginBtn" href="account.html">Account</a>
  </nav>
</header>
<div class="wrap">
  <div class="panel-card" id="panel">Loading…</div>
</div>
<script>
const panel = document.getElementById('panel');
const navBtn = document.getElementById('loginBtn');

function providerIcon(p){
  if(p==='discord') return `<span class="ico discord"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M20 4.4A18 18 0 0 0 15.6 3l-.3.6a15 15 0 0 1 3.8 1.4A16 16 0 0 0 12 3.4 16 16 0 0 0 4.9 5 15 15 0 0 1 8.7 3.6L8.4 3A18 18 0 0 0 4 4.4C1.6 8 1 11.6 1.2 15.1A18 18 0 0 0 6.6 18l.8-1.3a11 11 0 0 1-1.8-.9l.5-.4a13 13 0 0 0 11.8 0l.5.4c-.6.3-1.2.6-1.8.9l.8 1.3a18 18 0 0 0 5.4-2.9C23 11.4 22.1 7.8 20 4.4ZM8.7 13.6c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm6.6 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Z"/></svg></span>`;
  if(p==='twitter' || p==='x') return `<span class="ico" style="background:#000"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2Zm-1.2 18h1.7L7.4 4H5.6L17.7 20Z"/></svg></span>`;
  return `<span class="ico google"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></span>`;
}

function resolveProvider(user){
  const ids = user?.identities || [];
  const last = sessionStorage.getItem('rankme_last_provider');
  if(last && ids.some(i => i.provider === last)) return last === 'twitter' ? 'x' : last;
  if(ids.length){
    const sorted = [...ids].sort((a,b)=> new Date(b.last_sign_in_at||b.updated_at||0) - new Date(a.last_sign_in_at||a.updated_at||0));
    const p = sorted[0]?.provider || 'oauth';
    return p === 'twitter' ? 'x' : p;
  }
  const p = user?.app_metadata?.provider || 'oauth';
  return p === 'twitter' ? 'x' : p;
}

async function renderLogin(){
  navBtn.textContent = 'Account';
  navBtn.classList.remove('logged-in');
  panel.innerHTML = `
    <h1>Login</h1>
    <p class="sub">Login to save <b>Exclusive</b> rankings. Custom images stay in your browser only.</p>
    <div class="providers">
      <button class="prov" data-p="discord">${providerIcon('discord')} Continue with Discord</button>
      <button class="prov" data-p="google">${providerIcon('google')} Continue with Google</button>
      <button class="prov" data-p="x">${providerIcon('x')} Continue with X</button>
    </div>
    <p class="err" id="err" hidden></p>`;
  panel.querySelectorAll('.prov').forEach(b=>{
    b.onclick = async ()=>{
      try{
        sessionStorage.setItem('rankme_last_provider', b.dataset.p);
        await rankmeSignIn(b.dataset.p);
      }catch(e){
        const err = document.getElementById('err');
        err.hidden = false;
        err.textContent = e.message || String(e);
      }
    };
  });
}

async function renderCabinet(user){
  if (typeof updateNavAuth === 'function') updateNavAuth();
  else if (navBtn) {
    navBtn.textContent = user.user_metadata?.full_name || user.user_metadata?.name || 'Account';
    navBtn.classList.add('logged-in');
  }
  const name = user.user_metadata?.full_name || user.user_metadata?.custom_claims?.global_name || user.user_metadata?.name || user.email || 'User';
  const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || '';
  const provider = resolveProvider(user);
  const providerLabel = ({google:'Google', discord:'Discord', x:'X', twitter:'X'})[provider] || provider;

  let listHtml = '<div class="empty">Loading…</div>';
  panel.innerHTML = `
    <h1>Collection</h1>
    <p class="sub">Saved Exclusive rankings.</p>
    <div class="profile">
      <div class="avatar-wrap">
        <div class="holo-ring"></div>
        ${avatar ? `<img class="avatar" src="${avatar}" alt="">` : `<div class="avatar-fallback">${(name[0]||'U').toUpperCase()}</div>`}
      </div>
      <div class="meta"><b>${name}</b><span>${providerLabel}</span></div>
    </div>
    <div class="list">
      <h2>Saved</h2>
      <div id="listBox">${listHtml}</div>
    </div>
    <button class="login-btn ghost" id="logout">Log out</button>`;

  document.getElementById('logout').onclick = async ()=>{
    await rankmeSignOut();
    location.reload();
  };

  try{
    const rows = await listMyTierlists();
    const box = document.getElementById('listBox');
    if(!rows.length){
      box.innerHTML = '<div class="empty">Nothing saved yet.</div>';
    } else {
      box.innerHTML = rows.map(r=>{
        const tid = r.template_id || 'sf-duel';
        const openHref = 'tier.html?t=' + encodeURIComponent(tid);
        const when = r.updated_at ? new Date(r.updated_at).toLocaleString() : '';
        const pub = !!r.is_public;
        return `<div class="tl-item">
          <div><div class="t">${r.title||'Untitled'}${pub ? ' <span class="pub-badge">Public</span>' : ''}</div><div class="d">${r.template_id||'exclusive'} · ${when}</div></div>
          <div class="tl-actions">
            <a class="primary" href="${openHref}" data-id="${r.id}">Open</a>
            <button type="button" class="share" data-share="${r.id}">Share</button>
            <button type="button" class="pub-btn ${pub ? 'is-public' : ''}" data-pub="${r.id}" data-on="${pub ? '1' : '0'}">${pub ? 'Public' : 'Publish'}</button>
            <button type="button" class="danger" data-del="${r.id}">Delete</button>
          </div>
        </div>`;
      }).join('');
      box.querySelectorAll('[data-del]').forEach(btn=>{
        btn.onclick = ()=>{
          const id = btn.dataset.del;
          const modal = document.getElementById('delModal');
          modal.classList.add('open');
          const ok = document.getElementById('delOk');
          const cancel = document.getElementById('delCancel');
          const cleanup = ()=>{ modal.classList.remove('open'); ok.onclick=null; cancel.onclick=null; };
          cancel.onclick = cleanup;
          ok.onclick = async ()=>{
            cleanup();
            await deleteTierlist(id);
            renderCabinet(user);
          };
        };
      });
      box.querySelectorAll('[data-share]').forEach(btn=>{
        btn.onclick = async ()=>{
          const row = rows.find(x=>String(x.id)===String(btn.dataset.share));
          if(!row?.payload) return;
          try{
            const tid = encodeURIComponent(row.template_id || 'sf-duel');
            let url = location.origin + '/tier.html?t=' + tid;
            if(typeof createShortLink === 'function'){
              const code = await createShortLink(row.payload);
              if(code) url = location.origin + '/tier.html?t=' + tid + '&s=' + code;
            }
            if(url.indexOf('&s=') < 0 && url.indexOf('?s=') < 0){
              const json = JSON.stringify(row.payload);
              let hash = 'r' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
              url = location.origin + '/tier.html?t=' + tid + '#' + hash;
            }
            await navigator.clipboard.writeText(url);
            btn.textContent = 'Copied!';
            setTimeout(()=> btn.textContent = 'Share', 1500);
          }catch(e){
            alert('Could not copy link');
          }
        };
      });
      box.querySelectorAll('[data-pub]').forEach(btn=>{
        btn.onclick = async ()=>{
          const id = btn.dataset.pub;
          const on = btn.dataset.on === '1';
          try{
            await setTierlistPublic(id, !on);
            btn.dataset.on = on ? '0' : '1';
            btn.textContent = on ? 'Publish' : 'Public';
            btn.classList.toggle('is-public', !on);
            const title = btn.closest('.tl-item')?.querySelector('.t');
            if(title){
              title.querySelector('.pub-badge')?.remove();
              if(!on) title.insertAdjacentHTML('beforeend', ' <span class="pub-badge">Public</span>');
            }
          }catch(e){
            alert('Add column is_public to tierlists in Supabase (boolean).');
          }
        };
      });
      // Open with payload via sessionStorage
      box.querySelectorAll('a.primary').forEach(a=>{
        a.addEventListener('click', (e)=>{
          const id = a.getAttribute('data-id');
          const row = rows.find(x=>String(x.id)===String(id));
          if(row?.payload){
            sessionStorage.setItem('rankme_open_payload', JSON.stringify(row.payload));
          }
        });
      });
    }
  }catch(e){
    document.getElementById('listBox').innerHTML = `<div class="empty">Could not load lists. Create table <code>tierlists</code> in Supabase (see SQL below). ${e.message||''}</div>`;
  }
}

async function bootAccount(){
  if (typeof initSupabase !== 'function') {
    panel.innerHTML = '<div class="empty">Could not load auth. Refresh the page.</div>';
    return;
  }
  try {
    await initSupabase();
    const user = await getSessionUser();
    if(user){
      try{
        const ret = sessionStorage.getItem('rankme_login_return');
        const draft = sessionStorage.getItem('rankme_draft_payload');
        if(ret && draft){
          location.href = ret;
          return;
        }
      }catch(e){}
      await renderCabinet(user);
    } else {
      await renderLogin();
    }
  } catch (e) {
    console.error(e);
    panel.innerHTML = '<div class="empty">Something went wrong. <button type="button" class="btn-mini primary" onclick="location.reload()">Retry</button></div>';
  }
}

// deferred scripts in <head> run before DOMContentLoaded — wait for them
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootAccount);
} else {
  bootAccount();
}
</script>

<div class="modal-back" id="delModal">
  <div class="modal">
    <h3>Delete?</h3>
    <p>This cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="primary" id="delCancel">Cancel</button>
      <button type="button" class="danger" id="delOk">Delete</button>
    </div>
  </div>
</div>
<footer id="site-footer" class="site"></footer>
<script src="js/footer.js" defer></script>

</body>
</html>
