<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Battle Mode - RankMe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabaseClient.js?v=20260828f" defer></script>
<meta name="description" content="Quick head-to-head comparisons that build your tier list automatically.">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css?v=20260828f">
<link rel="stylesheet" href="css/battle-anim.css?v=20260828f">
</head>
<body>

<canvas id="battleStars" aria-hidden="true"></canvas>

<header class="site">
  <a class="brand" href="index.html">
    <img class="brand-full" src="assets/brand/RankMe_logo.svg" alt="RankMe">
    <img class="brand-mark" src="assets/brand/favicon.svg" alt="RankMe">
  </a>
  <nav class="main">
    <a href="index.html">Explore</a>
    <a class="login-btn" id="loginBtn" href="account.html">Account</a>
  </nav>
</header>

<main class="battle-page">
  <div class="battle-arena" id="battleArena">
    <h1 class="battle-question">Who wins?</h1>
    <p class="battle-sub">Pick one · <span id="battleTitle"></span></p>
    <div class="battle-vs-row" id="battleVsRow"></div>
  </div>
  <div class="battle-footer">
    <p class="battle-how" id="battleHow" hidden></p>
    <button class="battle-back" id="battleBack" type="button">Back</button>
  </div>
</main>

<div class="battle-overlay" id="battleOverlay">
  <div class="battle-panel" id="battlePanel"></div>
</div>

<footer id="site-footer" class="site"></footer>
<script src="js/footer.js?v=20260827q" defer></script>
<script src="js/battle.js?v=20260827q"></script>
<script src="js/battle-stars.js?v=20260827v" defer></script>
<script src="js/battle-ui.js?v=20260827v" defer></script>

</body>
</html>
