<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Start Ranking - RankMe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabaseClient.js" defer></script>
<meta name="description" content="Create tier lists in seconds. Drag, drop, share. Free, no sign-up.">
<meta property="og:title" content="New tier list - RankMe">
<meta property="og:description" content="Drag, rank, share - build your Street Fighter: Duel tier list on RankMe.">
<meta property="og:image" content="assets/brand/SF_Duel_Tier_logo.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css?v=20260826i">
</head>
<body>

<header class="site">
  <a class="brand" href="index.html">
    <img class="brand-full" src="assets/brand/RankMe_logo.svg" alt="RankMe">
    <img class="brand-mark" src="assets/brand/favicon.svg" alt="RankMe">
  </a>
  <nav class="main">
    <a href="index.html">Explore</a>
    <a class="login-btn" id="loginBtn" href="account.html">Account</a>
  </nav>
</header>

<section class="hero">
  <div class="blank-cover-card is-placeholder" id="blankCoverHost">
    <img id="blankCoverImg" src="assets/brand/Footer_logo.svg" alt="RankMe">
    <button type="button" class="blank-cover-edit" id="editCoverBtn" title="Change cover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
      </svg>
    </button>
    <input type="file" id="coverEditInput" accept="image/*" hidden>
  </div>
  <div class="hero-text blank-hero-text">
    <h1 class="hero-title" id="listTitle" contenteditable="true">My Rank</h1>
    <p class="desc">Upload, rank, export PNG.</p>
    <div class="blank-upload-row">
      <label class="pill-btn add" for="uploadImgs">
        <input type="file" id="uploadImgs" accept="image/*" multiple hidden>
        + Upload images
      </label>
    </div>
  </div>
</section>
<script>
(function(){
  var host = document.getElementById('blankCoverHost');
  var img = document.getElementById('blankCoverImg');
  var editBtn = document.getElementById('editCoverBtn');
  var input = document.getElementById('coverEditInput');

  function applyCover(src, isPlaceholder){
    if(!img || !host) return;
    img.src = src;
    if(isPlaceholder){
      host.classList.add('is-placeholder');
      img.style.filter = '';
    } else {
      host.classList.remove('is-placeholder');
      img.style.filter = 'none';
    }
  }

  try {
    var cover = sessionStorage.getItem('rankme_blank_cover');
    var title = sessionStorage.getItem('rankme_blank_title') || localStorage.getItem('rankme_draft_title');
    if (title) {
      var h = document.getElementById('listTitle');
      if (h) h.textContent = title;
      try { localStorage.setItem('rankme_draft_title', title); } catch (e2) {}
    }
    if (cover) applyCover(cover, false);
  } catch (e) {}

  if(editBtn && input){
    editBtn.addEventListener('click', function(){ input.click(); });
    input.addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0];
      if(!f || !f.type.startsWith('image/')) return;
      var r = new FileReader();
      r.onload = function(){
        applyCover(r.result, false);
        try { sessionStorage.setItem('rankme_blank_cover', r.result); } catch(err){}
      };
      r.readAsDataURL(f);
      e.target.value = '';
    });
  }
})();
</script>

<div class="board" id="board">
  <div class="board-inner" id="boardInner"></div>
</div>

<div class="toolbar">
  <div class="toolbar-actions">
    <button class="pill-btn add" id="addRowBtn"><span class="ico">+</span> Add row</button>
    <button class="pill-btn fill" id="fillAllBtn">Fill all</button>
    <button class="pill-btn danger" id="clearAllBtn">Clear all</button>
  </div>
  <div class="size-ctrl">
    <span>Size</span>
    <input type="range" id="sizeSlider" min="40" max="100" value="64">
    <button class="size-reset" id="sizeResetBtn" title="Reset size">&#8635;</button>
  </div>
  <div class="share-group">
    <span class="share-label">Share</span>
    <div class="share-ico discord" id="shareDiscord" title="Copy link for Discord">
      <svg viewBox="0 0 24 24"><path d="M20 4.4A18 18 0 0 0 15.6 3l-.3.6a15 15 0 0 1 3.8 1.4A16 16 0 0 0 12 3.4 16 16 0 0 0 4.9 5 15 15 0 0 1 8.7 3.6L8.4 3A18 18 0 0 0 4 4.4C1.6 8 1 11.6 1.2 15.1A18 18 0 0 0 6.6 18l.8-1.3a11 11 0 0 1-1.8-.9l.5-.4a13 13 0 0 0 11.8 0l.5.4c-.6.3-1.2.6-1.8.9l.8 1.3a18 18 0 0 0 5.4-2.9C23 11.4 22.1 7.8 20 4.4ZM8.7 13.6c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm6.6 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Z"/></svg>
    </div>
    <div class="share-ico telegram" id="shareTelegram" title="Share on Telegram">
      <svg viewBox="0 0 24 24"><path d="M21.5 3 2.6 10.4c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14.1c.3-1.3-.4-1.8-1.3-1.5Zm-3.4 3.7-8.5 7.7-.3 3.1-1.6-5 10-6.4c.5-.3.9-.1.4.4Z"/></svg>
    </div>
    <div class="share-ico x" id="shareX" title="Share on X">
      <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2Zm-1.2 18h1.7L7.4 4H5.6L17.7 20Z"/></svg>
    </div>
  </div>
  <button class="download-btn" id="downloadBtn">Download PNG</button>
</div>



<div class="pool-wrap">
  <div class="pool-header">
    <div class="faction-filters" id="factionFilters"></div>
    <button class="portal-btn" id="portalBtn" type="button" title="Portals">TELEPORTATION</button>
  </div>
  <div class="portals-bar" id="portalsBar" hidden></div>
  <div class="pool" id="pool"></div>
</div>

<footer id="site-footer" class="site"></footer>
<script src="js/footer.js" defer></script>


<div class="modal-back" id="leaveModal">
  <div class="modal">
    <h3>Leave?</h3>
    <p>This ranking is not saved.</p>
    <div class="modal-actions">
      <button class="primary" id="stayBtn">Stay</button>
      <button id="leaveBtn">Leave anyway</button>
    </div>
  </div>
</div>

<div class="modal-back" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button id="confirmCancel">Cancel</button>
      <button class="primary" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<canvas id="exportCanvas" style="display:none"></canvas>

<script>window.RANKME_BLANK=true;</script>
<script src="js/app.js"></script>
</body>
</html>
