<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Create tier list - RankMe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css">

</head>
<body>
<header class="site">
  <a class="brand" href="index.html"><img src="assets/brand/RankMe_logo.svg" alt="RankMe"></a>
  <nav class="main">
    <a href="index.html">Browse</a>
    <a href="create.html" class="cta-nav">Create</a>
    <button class="login-btn" id="loginBtn" type="button">Account</button>
  </nav>
</header>

<div class="wrap narrow">
  <div class="panel-card">
    <h1>New tier list</h1>
    <p class="sub">Build offline, export PNG anytime. No account needed.</p>

    <label>Title</label>
    <input type="text" id="title" placeholder="My tier list" maxlength="60">

    <label>Cover (optional)</label>
    <div class="cover-drop" id="coverDrop">Drop image or click · 1200×630</div>
    <input type="file" id="coverFile" accept="image/*" hidden>
    <p class="hint">For the gallery card later. Optional.</p>

    <div class="row">
      <button class="btn primary" id="startBlank">Start blank</button>
    </div>

    <div class="note">
      Custom lists stay in your browser. Only Exclusive rankings can be saved with Login.
    </div>
  </div>
</div>

<footer id="site-footer" class="site"></footer>
<script src="js/footer.js" defer></script>

<script>
let coverDataUrl = null;
document.getElementById('coverDrop').onclick = () => document.getElementById('coverFile').click();
document.getElementById('coverFile').onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const drop = document.getElementById('coverDrop');
  const reader = new FileReader();
  reader.onload = () => {
    coverDataUrl = reader.result;
    drop.innerHTML = '';
    const img = document.createElement('img');
    img.src = coverDataUrl;
    img.alt = f.name;
    img.style.cssText = 'max-width:100%;max-height:160px;border-radius:10px;display:block;margin:0 auto';
    drop.appendChild(img);
  };
  reader.readAsDataURL(f);
};
document.getElementById('startBlank').onclick = () => {
  const title = document.getElementById('title').value.trim() || 'My tier list';
  try {
    sessionStorage.setItem('rankme_blank_title', title);
    localStorage.setItem('rankme_draft_title', title);
    if (coverDataUrl) sessionStorage.setItem('rankme_blank_cover', coverDataUrl);
    else sessionStorage.removeItem('rankme_blank_cover');
  } catch (e) {}
  location.href = 'builder.html';
};
</script>
</body>
</html>
