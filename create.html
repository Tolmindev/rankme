<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Create tier list - RankMe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabaseClient.js?v=20260901d" defer></script>
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css?v=20260901f">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<header class="site">
  <a class="brand" href="index.html">
    <img class="brand-full" src="assets/brand/RankMe_logo.svg" alt="RankMe">
    <img class="brand-mark" src="assets/brand/favicon.svg" alt="RankMe">
  </a>
  <nav class="main">
    <a href="index.html">Explore</a>
    <a class="login-btn" id="loginBtn" href="account.html">Account</a>
  </nav>
</header>

<div class="wrap narrow">
  <div class="panel-card">
    <div class="create-head">
      <h1>New Rank</h1>
      <div class="tag-dd" id="tagDd">
        <button type="button" class="tag-dd-btn" id="tagDdBtn">Other</button>
        <div class="tag-dd-menu" id="tagDdMenu" role="listbox">
          <button type="button" class="tag-dd-item" data-value="games">Games</button>
          <button type="button" class="tag-dd-item" data-value="anime">Anime</button>
          <button type="button" class="tag-dd-item" data-value="movies">Movies</button>
          <button type="button" class="tag-dd-item" data-value="tv">TV</button>
          <button type="button" class="tag-dd-item" data-value="sports">Sports</button>
          <button type="button" class="tag-dd-item" data-value="music">Music</button>
          <button type="button" class="tag-dd-item" data-value="memes">Memes</button>
          <button type="button" class="tag-dd-item" data-value="technology">Tech</button>
          <button type="button" class="tag-dd-item active" data-value="other">Other</button>
        </div>
        <input type="hidden" id="tagSelect" value="other">
      </div>
    </div>

    <label>Title</label>
    <input type="text" id="title" placeholder="My Rank" maxlength="48">

    <label>Cover</label>
    <div class="cover-drop" id="coverDrop">Drop image or click · 1200×630</div>
    <input type="file" id="coverFile" accept="image/*" hidden>

    <div class="create-actions">
      <button class="btn primary" id="startBlank" type="button">Start</button>
      <a class="btn ghost" href="index.html">Templates</a>
    </div>

    <div class="images-drop" id="imagesDrop" title="Add ranking images">
      <div class="ico" aria-hidden="true">↑</div>
      <div class="hint">Drop images here or click to choose<br>Your files stay on this device</div>
      <div class="count" id="imagesCount" hidden></div>
    </div>
    <input type="file" id="imagesFile" accept="image/*" multiple hidden>
    <div class="images-preview" id="imagesPreview"></div>
  </div>
</div>

<footer id="site-footer" class="site"></footer>
<script src="js/footer.js?v=20260827q" defer></script>
<script>
(function () {
  var coverDataUrl = null;
  var imageFiles = []; // {name, dataUrl}

  var coverDrop = document.getElementById('coverDrop');
  var coverFile = document.getElementById('coverFile');
  var imagesDrop = document.getElementById('imagesDrop');
  var imagesFile = document.getElementById('imagesFile');
  var imagesPreview = document.getElementById('imagesPreview');
  var imagesCount = document.getElementById('imagesCount');
  var tagSelect = document.getElementById('tagSelect');
  var tagDd = document.getElementById('tagDd');
  var tagDdBtn = document.getElementById('tagDdBtn');
  var tagDdMenu = document.getElementById('tagDdMenu');
  if (tagDdBtn && tagDd && tagDdMenu) {
    tagDdBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      tagDd.classList.toggle('open');
    });
    tagDdMenu.querySelectorAll('.tag-dd-item').forEach(function (item) {
      item.addEventListener('click', function (e) {
        e.stopPropagation();
        var v = item.getAttribute('data-value') || '';
        tagSelect.value = v;
        tagDdBtn.textContent = item.textContent.trim();
        tagDdMenu.querySelectorAll('.tag-dd-item').forEach(function (x) { x.classList.remove('active'); });
        item.classList.add('active');
        tagDd.classList.remove('open');
      });
    });
    document.addEventListener('click', function () { tagDd.classList.remove('open'); });
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  function fitDataUrl(dataUrl, maxEdge, quality) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || 1, h = img.naturalHeight || 1;
        var scale = Math.min(1, maxEdge / Math.max(w, h));
        if (scale === 1 && dataUrl.length < 280000) { resolve(dataUrl); return; }
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        var g = c.getContext('2d');
        g.fillStyle = '#1a1528';
        g.fillRect(0, 0, cw, ch);
        g.drawImage(img, 0, 0, cw, ch);
        resolve(c.toDataURL('image/jpeg', quality || 0.82));
      };
      img.onerror = function () { resolve(dataUrl); };
      img.src = dataUrl;
    });
  }

  function applyCover(url, name) {
    coverDataUrl = url;
    coverDrop.innerHTML = '';
    var img = document.createElement('img');
    img.src = url;
    img.alt = name || 'Cover';
    coverDrop.appendChild(img);
  }

  coverDrop.onclick = function () { coverFile.click(); };
  coverFile.onchange = function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f || !f.type || f.type.indexOf('image/') !== 0) return;
    readFile(f).then(function (url) {
      return fitDataUrl(url, 1200, 0.84);
    }).then(function (url) { applyCover(url, f.name); });
  };
  ;['dragenter','dragover'].forEach(function (ev) {
    coverDrop.addEventListener(ev, function (e) {
      e.preventDefault(); coverDrop.classList.add('drag-over');
    });
  });
  ;['dragleave','drop'].forEach(function (ev) {
    coverDrop.addEventListener(ev, function (e) {
      e.preventDefault(); coverDrop.classList.remove('drag-over');
    });
  });
  coverDrop.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f || !f.type.startsWith('image/')) return;
    readFile(f).then(function (url) {
      return fitDataUrl(url, 1200, 0.84);
    }).then(function (url) { applyCover(url, f.name); });
  });

  function refreshPreview() {
    imagesPreview.innerHTML = '';
    imageFiles.forEach(function (it, idx) {
      var wrap = document.createElement('div');
      wrap.className = 'img-chip';
      var img = document.createElement('img');
      img.src = it.dataUrl;
      img.alt = it.name;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'img-chip-x';
      btn.setAttribute('aria-label', 'Remove image');
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        imageFiles.splice(idx, 1);
        refreshPreview();
      });
      wrap.appendChild(img);
      wrap.appendChild(btn);
      imagesPreview.appendChild(wrap);
    });
    if (imageFiles.length) {
      imagesCount.hidden = false;
      imagesCount.textContent = imageFiles.length + (imageFiles.length === 1 ? ' image' : ' images');
    } else {
      imagesCount.hidden = true;
    }
  }

  var MAX_CREATE_IMAGES = 200;

  function addImageFiles(fileList) {
    var list = Array.prototype.slice.call(fileList || []);
    list = list.filter(function (f) { return f && f.type && f.type.startsWith('image/'); });
    if (!list.length) return;
    var room = MAX_CREATE_IMAGES - imageFiles.length;
    if (room <= 0) {
      alert('Max ' + MAX_CREATE_IMAGES + ' images. Remove some first.');
      return;
    }
    var clipped = list.length > room;
    if (clipped) list = list.slice(0, room);
    Promise.all(list.map(function (f) {
      return readFile(f).then(function (url) {
        return fitDataUrl(url, 640, 0.82);
      }).then(function (url) {
        return { name: f.name, dataUrl: url };
      });
    })).then(function (items) {
      imageFiles = imageFiles.concat(items);
      refreshPreview();
      if (clipped) alert('Added ' + items.length + '. Max is ' + MAX_CREATE_IMAGES + '.');
    });
  }

  imagesDrop.onclick = function () { imagesFile.click(); };
  imagesFile.onchange = function (e) {
    addImageFiles(e.target.files);
    imagesFile.value = '';
  };
  ;['dragenter','dragover'].forEach(function (ev) {
    imagesDrop.addEventListener(ev, function (e) {
      e.preventDefault(); imagesDrop.classList.add('drag-over');
    });
  });
  ;['dragleave','drop'].forEach(function (ev) {
    imagesDrop.addEventListener(ev, function (e) {
      e.preventDefault(); imagesDrop.classList.remove('drag-over');
    });
  });
  imagesDrop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files) addImageFiles(e.dataTransfer.files);
  });

  document.getElementById('startBlank').onclick = function () {
    var title = (document.getElementById('title').value || 'My Rank').trim().slice(0, 48);
    var tag = (tagSelect.value || '').trim();
    try {
      sessionStorage.setItem('rankme_blank_title', title);
      if (coverDataUrl) sessionStorage.setItem('rankme_blank_cover', coverDataUrl);
      else sessionStorage.removeItem('rankme_blank_cover');
      if (tag) sessionStorage.setItem('rankme_blank_tag', tag);
      else sessionStorage.removeItem('rankme_blank_tag');
      if (imageFiles.length) {
        sessionStorage.setItem('rankme_blank_images', JSON.stringify(imageFiles));
      } else {
        sessionStorage.removeItem('rankme_blank_images');
      }
      sessionStorage.setItem('rankme_nav_ok', '1');
    } catch (err) {
      alert('Storage full - remove some images and try again.');
      return;
    }
    location.href = 'builder.html?blank=1';
  };
})();
</script>
</body>
</html>
