    <section class="discover-toolbar" aria-label="Search and filter templates">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="homeSearch" type="text" placeholder="Search…" autocomplete="off">
        <button type="button" class="clear-btn" id="homeSearchClear" hidden aria-label="Clear search">

        </button>
      </div>
      <div class="filter-row">
        <div class="chip-scroll" id="categoryChips">
          <span class="skel skel-chip" aria-hidden="true"></span>
          <span class="skel skel-chip" aria-hidden="true"></span>
          <span class="skel skel-chip" aria-hidden="true"></span>
          <span class="skel skel-chip" aria-hidden="true"></span>
          <span class="skel skel-chip" aria-hidden="true"></span>
        </div>
        <div class="dd sort-dd" id="sortDd">
          <button type="button" class="dd-trigger sort-trigger" id="sortDdTrigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Sort">
            <span id="sortDdLabel" class="sort-label">Newest</span>
            <svg class="sort-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            <svg class="sort-menu-ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <ul class="dd-menu" id="sortDdMenu" role="listbox">
            <li role="option" data-value="newest" aria-selected="true">Newest</li>
            <li role="option" data-value="featured">Featured</li>
            <li role="option" data-value="alphabetical">Alphabetical</li>
            <li role="option" data-value="popular">Popular</li>
          </ul>
        </div>
      </div>
    </section>
