<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>RankMe - Drag. Rank. Share.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabaseClient.js" defer></script>
<meta property="og:title" content="RankMe - The easiest way to create tier lists">
<meta property="og:description" content="Build tier lists. Export PNG. Share. No account needed.">
<meta property="og:image" content="https://rankme.lol/assets/brand/Share_RankMe.png?v=20260807">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Build tier lists. Export PNG. Share. No account needed.">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css?v=20260821cc8">
</head>
<body>

<header class="site">
  <a class="brand" href="index.html"><img src="assets/brand/RankMe_logo.svg" alt="RankMe"></a>
  <nav class="main">
    <a href="index.html" class="active">Browse</a>
    <a href="create.html" class="cta-nav">Create</a>
    <a class="login-btn" id="loginBtn" href="account.html">Account</a>
  </nav>
</header>

<main class="page">
  <div class="home-wrap">

    <section class="hero-home">
      <h1>Drag. Rank. Share.</h1>
      <p>Build tier lists. Export PNG. Share. No account needed.</p>
      <div class="cta-row">
        <a class="cta primary cta-start" href="create.html">Start Ranking</a>
      </div>
    </section>

    <section class="discover-toolbar" aria-label="Search and filter templates">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="homeSearch" type="text" placeholder="Search…" autocomplete="off">
        <button type="button" class="clear-btn" id="homeSearchClear" hidden aria-label="Clear search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="filter-row">
        <div class="chip-scroll" id="categoryChips"></div>
        <div class="dd" id="sortDd">
          <button type="button" class="dd-trigger" id="sortDdTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="sortDdLabel">Featured</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul class="dd-menu" id="sortDdMenu" role="listbox">
            <li role="option" data-value="featured" aria-selected="true">Featured</li>
            <li role="option" data-value="newest">Newest</li>
            <li role="option" data-value="alphabetical">Alphabetical</li>
            <li role="option" data-value="popular">Popular</li>
          </ul>
        </div>
      </div>
    </section>

    <section aria-label="Templates">
      <div class="section-head">
        <h2 class="section-title">Templates</h2>
        <p class="results-meta" id="resultsMeta"></p>
      </div>
            <div class="grid" id="discoverGrid" aria-busy="true">
        <div class="tl-card skel-card" aria-hidden="true">
          <div class="cover skel-block skel-cover"></div>
          <div class="body">
            <div class="skel-line skel-line-title"></div>
            <div class="skel-line skel-line-sub"></div>
            <div class="skel-line skel-line-meta"></div>
          </div>
        </div>
        <div class="tl-card skel-card" aria-hidden="true">
          <div class="cover skel-block skel-cover"></div>
          <div class="body">
            <div class="skel-line skel-line-title"></div>
            <div class="skel-line skel-line-sub"></div>
            <div class="skel-line skel-line-meta"></div>
          </div>
        </div>
        <div class="tl-card skel-card" aria-hidden="true">
          <div class="cover skel-block skel-cover"></div>
          <div class="body">
            <div class="skel-line skel-line-title"></div>
            <div class="skel-line skel-line-sub"></div>
            <div class="skel-line skel-line-meta"></div>
          </div>
        </div>
        <div class="tl-card skel-card" aria-hidden="true">
          <div class="cover skel-block skel-cover"></div>
          <div class="body">
            <div class="skel-line skel-line-title"></div>
            <div class="skel-line skel-line-sub"></div>
            <div class="skel-line skel-line-meta"></div>
          </div>
        </div>
        <div class="tl-card skel-card" aria-hidden="true">
          <div class="cover skel-block skel-cover"></div>
          <div class="body">
            <div class="skel-line skel-line-title"></div>
            <div class="skel-line skel-line-sub"></div>
            <div class="skel-line skel-line-meta"></div>
          </div>
        </div>
        <div class="tl-card skel-card" aria-hidden="true">
          <div class="cover skel-block skel-cover"></div>
          <div class="body">
            <div class="skel-line skel-line-title"></div>
            <div class="skel-line skel-line-sub"></div>
            <div class="skel-line skel-line-meta"></div>
          </div>
        </div>
      </div>
    </section>

    <section aria-label="Community Rankings" class="community-section">
      <div id="communityBody"></div>
    </section>

  </div>
</main>

<footer id="site-footer" class="site"></footer>
<script src="js/footer.js" defer></script>
<script src="js/home.js" defer></script>
</body>
</html>
