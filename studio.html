<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Studio - RankMe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabaseClient.js?v=20261021r" defer></script>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="48x48" href="assets/brand/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css?v=20261021q">
<style>
  .studio { max-width: 720px; margin: 28px auto 80px; padding: 0 16px; }
  .studio h1 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 800; }
  .studio .lead { margin: 0 0 22px; font-weight: 300; color: rgba(255,255,255,.72); }
  .studio form, .studio-list { display: grid; gap: 14px; }
  .studio label { display: grid; gap: 6px; font-size: .78rem; font-weight: 600; color: #c9bddf; }
  .studio input, .studio textarea, .studio select {
    width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(180,150,230,.35);
    background: #14111c; color: #fff; font: inherit; font-weight: 500; padding: 10px 12px;
  }
  .studio-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .studio .show-all-btn { justify-self: start; }
  .studio-msg { min-height: 1.2em; margin: 12px 0 0; font-size: .78rem; font-weight: 200; color: #b7f0c8; }
  .studio-msg.is-bad { color: #ffb4c4; }
  .studio-list { list-style: none; margin: 28px 0 0; padding: 0; }
  .studio-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .studio-list a { color: #fff; font-weight: 700; text-decoration: none; }
  .studio-del { border: 0; background: none; color: #ffb4c4; font: inherit; font-weight: 600; cursor: pointer; }
  @media (max-width: 640px) { .studio-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<header class="site">
  <a class="brand" href="index.html">
    <img class="brand-full" src="assets/brand/RankMe_logo.svg?v=2" alt="RankMe">
    <img class="brand-mark" src="assets/brand/favicon.svg?v=2" alt="RankMe">
  </a>
</header>
<main class="studio">
  <h1>Studio</h1>
  <p class="lead">Build an official list. It shows in Templates.</p>
  <div id="studio"><p>Opening…</p></div>
  <p class="studio-msg" id="studioMsg"></p>
</main>
<script src="js/studio.js?v=20261021r" defer></script>
</body>
</html>
