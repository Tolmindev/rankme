<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Tier List - RankMe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabaseClient.js?v=20260901q" defer></script>
<meta name="description" content="Create tier lists in seconds. Drag, drop, share. Free, no sign-up.">
<meta property="og:title" content="Tier List - RankMe" id="metaOgTitle">
<meta property="og:description" content="Drag, rank, share on RankMe." id="metaOgDesc">
<meta property="og:image" content="https://rankme.lol/assets/brand/Share_RankMe.webp?v=20260827q" id="metaOgImage">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://rankme.lol/assets/brand/Share_RankMe.webp?v=20260827q" id="metaTwImage">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/rankme.css?v=20260901t">
<style>
  .boot-error{max-width:420px;margin:48px auto;padding:24px;border-radius:14px;background:#1a1728;border:1px solid rgba(255,100,100,.35);color:#ffb3b3;font-weight:700;text-align:center}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<header class="site">
  <a class="brand" href="index.html">
    <img class="brand-full" src="assets/brand/RankMe_logo.svg" alt="RankMe">
    <img class="brand-mark" src="assets/brand/favicon.svg" alt="RankMe">
  </a>
  <nav class="main">
    <a href="index.html">Explore</a>
    <a class="login-btn" id="loginBtn" href="account.html">Account</a>
  </nav>
</header>

<div id="bootStatus" class="boot-loading" aria-busy="true" aria-label="Loading">
  <div class="skel-tier-boot" aria-hidden="true">
    <div class="skel-tier-hero">
      <div class="skel skel-tier-cover"></div>
      <div class="skel-tier-copy">
        <div class="skel skel-line skel-line-title"></div>
        <div class="skel skel-line skel-sm"></div>
        <div class="skel skel-pill skel-tier-cta"></div>
      </div>
    </div>
    <div class="skel-board">
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
    </div>
    <div class="skel-toolbar">
      <div class="skel-tb-icons">
        <div class="skel skel-tb-btn"></div>
        <div class="skel skel-tb-btn"></div>
        <div class="skel skel-tb-btn"></div>
        <div class="skel skel-tb-btn"></div>
        <div class="skel skel-tb-btn"></div>
        <div class="skel skel-tb-btn"></div>
      </div>
      <div class="skel-tb-row2">
        <div class="skel skel-tb-size"></div>
        <div class="skel skel-tb-dl"></div>
      </div>
    </div>
    <div class="skel-pool">
      <div class="skel-filters">
        <span class="skel skel-chip"></span>
        <span class="skel skel-chip"></span>
        <span class="skel skel-chip"></span>
        <span class="skel skel-chip"></span>
      </div>
      <div class="skel skel-portal"></div>
      <div class="skel-pool-cards">
        <div class="skel skel-pcard"></div>
        <div class="skel skel-pcard"></div>
        <div class="skel skel-pcard"></div>
        <div class="skel skel-pcard"></div>
        <div class="skel skel-pcard"></div>
        <div class="skel skel-pcard"></div>
        <div class="skel skel-pcard"></div>
        <div class="skel skel-pcard"></div>
      </div>
    </div>
  </div>
</div>

<section class="hero" id="heroSection" hidden>
  <div class="parallax-host" id="coverHost"><img class="title-logo cover-card parallax-img" id="coverImg" src="" alt=""></div>
  <div class="hero-text">
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="desc" id="heroDesc"></p>
  </div>
</section>

<div class="board" id="board" hidden>
  <div class="board-inner" id="boardInner"></div>
</div>

<div class="toolbar" id="toolbar" hidden>
  <div class="tb-icons">
    <div class="toolbar-actions">
      <button class="pill-btn add" id="addRowBtn" type="button">
        <span class="ico">+</span>
        <span class="tb-g" aria-hidden="true"></span>
        <span class="tb-t">Add row</span>
      </button>
      <button class="pill-btn fill" id="fillAllBtn" type="button">
        <span class="tb-g" aria-hidden="true"></span>
        <span class="tb-t">Auto Fill</span>
      </button>
      <button class="pill-btn danger" id="clearAllBtn" type="button">
        <span class="tb-g" aria-hidden="true"></span>
        <span class="tb-t">Clear all</span>
      </button>
    </div>
    <span class="tb-split" aria-hidden="true"></span>
    <div class="tb-share">
      <div class="share-group">
        <span class="share-label">Share</span>
        <div class="share-ico discord" id="shareDiscord" title="Copy link for Discord">
          <svg viewBox="0 0 24 24"><path d="M20 4.4A18 18 0 0 0 15.6 3l-.3.6a15 15 0 0 1 3.8 1.4A16 16 0 0 0 12 3.4 16 16 0 0 0 4.9 5 15 15 0 0 1 8.7 3.6L8.4 3A18 18 0 0 0 4 4.4C1.6 8 1 11.6 1.2 15.1A18 18 0 0 0 6.6 18l.8-1.3a11 11 0 0 1-1.8-.9l.5-.4a13 13 0 0 0 11.8 0l.5.4c-.6.3-1.2.6-1.8.9l.8 1.3a18 18 0 0 0 5.4-2.9C23 11.4 22.1 7.8 20 4.4ZM8.7 13.6c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm6.6 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Z"/></svg>
        </div>
        <div class="share-ico telegram" id="shareTelegram" title="Share on Telegram">
          <svg viewBox="0 0 24 24"><path d="M21.5 3 2.6 10.4c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14.1c.3-1.3-.4-1.8-1.3-1.5Zm-3.4 3.7-8.5 7.7-.3 3.1-1.6-5 10-6.4c.5-.3.9-.1.4.4Z"/></svg>
        </div>
        <div class="share-ico x" id="shareX" title="Share on X">
          <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2Zm-1.2 18h1.7L7.4 4H5.6L17.7 20Z"/></svg>
        </div>
      </div>
      <button class="pill-btn tb-share-btn" id="shareBtn" type="button" title="Share">
        <span class="tb-g" aria-hidden="true"></span>
        <span class="tb-t">Share</span>
      </button>
      <button class="pill-btn remix-btn" id="remixBtn" type="button" title="Remix">
        <span class="tb-g" aria-hidden="true"></span>
        <span class="tb-t">Remix</span>
      </button>
      <button class="pill-btn save-btn" id="saveAccountBtn" type="button" title="Save">
        <span class="tb-g" aria-hidden="true"></span>
        <span class="tb-t">Save</span>
      </button>
    </div>
  </div>
  <div class="tb-row2">
    <div class="size-ctrl">
      <span>Size</span>
      <input type="range" id="sizeSlider" min="40" max="100" value="64">
      <button class="size-reset" id="sizeResetBtn" title="Reset size">&#8635;</button>
    </div>
    <button class="download-btn" id="downloadBtn" type="button">Download PNG</button>
  </div>
  <label class="pill-btn upload-remix" id="remixUploadWrap" hidden>
    <input type="file" id="remixUpload" accept="image/*" multiple hidden>
    + Add Images
  </label>
</div>

<div class="pool-wrap" id="poolWrap" hidden>
  <div class="pool-header">
    <div class="faction-filters" id="factionFilters"></div>
    <button class="portal-btn" id="portalBtn" type="button" title="Portals">TELEPORTATION</button>
  </div>
  <div class="portals-bar" id="portalsBar" hidden></div>
  <div class="pool" id="pool"></div>
</div>

<footer id="site-footer" class="site"></footer>
<script src="js/footer.js?v=20260827q" defer></script>


<div class="modal-back" id="leaveModal">
  <div class="modal">
    <h3>Leave?</h3>
    <p>This ranking is not saved.</p>
    <div class="modal-actions">
      <button class="primary" id="stayBtn">Stay</button>
      <button id="leaveBtn">Leave anyway</button>
    </div>
  </div>
</div>

<div class="modal-back" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button id="confirmCancel">Cancel</button>
      <button class="primary" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="exportCanvas" style="display:none"></canvas>

<script src="js/boot.js?v=20260828g"></script>
</body>
</html>
